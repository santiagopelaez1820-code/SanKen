# Esta línea sirve para definir el nombre del flujo de trabajo.
name: Web (React)

# Esta línea sirve para definir cuándo se ejecuta el flujo.
on:
  # Esta línea sirve para ejecutar al hacer push.
  push:
    # Esta línea sirve para limitar el push a la rama main.
    branches: [main]
    # Esta línea sirve para limitar a cambios en la web, el núcleo o este flujo.
    paths: ["apps/web/**", "packages/core/**", ".github/workflows/web.yml"]
  # Esta línea sirve para ejecutar también en pull requests.
  pull_request:
    # Esta línea sirve para limitar a cambios en la web, el núcleo o este flujo.
    paths: ["apps/web/**", "packages/core/**", ".github/workflows/web.yml"]

# Esta línea sirve para declarar los trabajos del flujo.
jobs:
  # Esta línea sirve para declarar el trabajo de construcción.
  build:
    # Esta línea sirve para ejecutar el trabajo en una máquina Ubuntu.
    runs-on: ubuntu-latest
    # Esta línea sirve para declarar los pasos del trabajo.
    steps:
      # Esta línea sirve para descargar el código del repositorio.
      - uses: actions/checkout@v4

      # Esta línea sirve para abrir el paso que instala Node.
      - name: Setup Node
        # Esta línea sirve para usar la acción que instala Node.
        uses: actions/setup-node@v4
        # Esta línea sirve para pasar los parámetros a la acción.
        with:
          # Esta línea sirve para usar Node 22.
          node-version: "22"
          # Esta línea sirve para activar la caché de npm.
          cache: "npm"

      # Esta línea sirve para abrir el paso que instala las dependencias.
      - name: Install dependencies
        # Esta línea sirve para instalar las dependencias exactas con npm ci.
        run: npm ci

      # Esta línea sirve para abrir el paso de análisis de código.
      - name: Lint
        # Esta línea sirve para ejecutar el linter de la web.
        run: npm run lint --workspace=apps/web

      # Esta línea sirve para abrir el paso de verificación de tipos.
      - name: Type-check
        # Esta línea sirve para verificar los tipos con TypeScript.
        run: npx tsc -b --noEmit
        # Esta línea sirve para ejecutar el comando dentro de apps/web.
        working-directory: apps/web

      # Esta línea sirve para abrir el paso de pruebas unitarias.
      - name: Unit tests
        # Esta línea sirve para ejecutar las pruebas unitarias de la web.
        run: npm run test:unit --workspace=apps/web

      # Esta línea sirve para abrir el paso de construcción.
      - name: Build
        # Esta línea sirve para construir la web para producción.
        run: npm run build --workspace=apps/web
