; Límites de subida para `php artisan serve` (ver scripts/start-sanken-wsl.sh,
; que agrega esta carpeta vía PHP_INI_SCAN_DIR). El default de PHP es
; upload_max_filesize=2M / post_max_size=8M: cualquier video de evidencia de
; PR (hasta 100 MB, ver UploadPrSubmissionVideoRequest) o de ejercicio se
; cortaba antes de llegar a Laravel, que respondía "el video es obligatorio".
upload_max_filesize = 110M
post_max_size = 120M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
